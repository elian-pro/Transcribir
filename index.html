
<!DOCTYPE html>
<html lang="es" data-ds-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriptor · Zebra</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0A0A0A">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Colores, radios y sombras vienen de los tokens del Zebra Design System (styles/tokens.css).
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: 'var(--bg)',
                        surface: 'var(--surface)',
                        'surface-2': 'var(--surface-2)',
                        fg: 'var(--text)',
                        muted: 'var(--text-muted)',
                        accent: 'var(--accent)',
                        'on-accent': 'var(--bg)',
                        line: 'var(--border)',
                        'line-strong': 'var(--border-strong)',
                        danger: 'var(--danger)'
                    },
                    borderRadius: {
                        chip: 'var(--r-chip)',
                        control: 'var(--r-control)',
                        input: 'var(--r-input)',
                        btn: 'var(--r-btn)',
                        card: 'var(--r-card)'
                    },
                    boxShadow: {
                        sm: 'var(--shadow-sm)',
                        md: 'var(--shadow-md)',
                        lg: 'var(--shadow-lg)',
                        card: 'var(--shadow-card)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        /* Eyebrow / label del DS (ZR-09): JetBrains Mono, mayúscula, tracking amplio */
        .label {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--text-muted);
        }
        /* El wordmark es negro: en dark se invierte a blanco, sin recolorear (ZR-12) */
        [data-ds-theme="dark"] .logo { filter: invert(1); }
        /* Foco fino del DS (ZR-18) */
        :focus-visible {
            outline: none;
            box-shadow: 0 0 0 1px var(--accent);
            transition: box-shadow .18s cubic-bezier(.16,1,.3,1);
        }
        /* Barra de progreso indeterminada: no inventamos porcentajes que no conocemos */
        .bar-indeterminate { width: 35%; animation: bar-slide 1.4s cubic-bezier(.16,1,.3,1) infinite; }
        @keyframes bar-slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
        @media (prefers-reduced-motion: reduce) {
            .bar-indeterminate { width: 100%; animation: none; opacity: .5; }
            *, *::before, *::after { transition: none !important; animation-duration: 0s !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
